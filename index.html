<title>Portfolio Tech Book V1</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#efe8da;--paper:#fffdf8;--card:#fff;--ink:#1d1d22;--mut:#6b6b76;--line:#e6e2d9;--edge:#cdbfa5;--l7:#2f6fed;--l8:#c2410c;--l7b:#e8f0ff;--l8b:#fff0e6;color-scheme:light}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Fraunces",Georgia,"Times New Roman",serif;display:flex;flex-direction:column;gap:10px;padding:10px 16px;box-sizing:border-box}
.top{max-width:1000px;width:100%;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.ttl{font-weight:700;font-size:1.05rem}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button,select{font:inherit;font-size:.82rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.book{flex:1;min-height:0;max-width:1000px;width:100%;margin:0 auto;background:var(--paper);border-radius:12px;box-shadow:0 0 0 6px #d9cdb6,0 12px 30px rgba(70,50,15,.18);overflow:hidden;box-sizing:border-box}
.spread{height:100%;display:grid;grid-template-columns:1fr 1fr;animation:turn .35s ease}
@keyframes turn{from{opacity:0;transform:translateX(var(--dx,24px))}to{opacity:1;transform:none}}
.page{padding:28px 32px;overflow:auto;display:flex;flex-direction:column;min-height:0}
.left{box-shadow:inset -22px 0 24px -22px rgba(70,50,15,.35);border-right:1px solid var(--line)}
.right{box-shadow:inset 22px 0 24px -22px rgba(70,50,15,.35)}
.L7{--c:var(--l7);--cb:var(--l7b)}.L8{--c:var(--l8);--cb:var(--l8b)}
.chap{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600}
.rt{margin:2px 0 14px;font-size:1.05rem;font-weight:600;color:var(--mut)}
.tag{align-self:flex-start;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--cb);color:var(--c)}
.qq{font-size:1.5rem;line-height:1.3;font-weight:600;margin:16px 0;border-left:5px solid var(--c);padding-left:16px}
.pno{margin-top:auto;padding-top:12px;font-size:.78rem;color:var(--mut)}.right .pno{text-align:right}
.row{padding:9px 0;border-top:1px solid var(--line)}
.lab{font-size:.72rem;font-weight:700;color:var(--c);text-transform:uppercase;letter-spacing:.05em}
.meter{display:flex;height:24px;border-radius:7px;overflow:hidden;margin:10px 0 4px;font-size:.72rem;font-weight:600;color:#fff}
.meter span{display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap}
.m0{background:var(--l7)}.m1{background:#2a9d6f}.m2{background:#8a63d2}
.tbl{width:100%;border-collapse:collapse;font-size:.78rem;margin:10px 0}.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}.tbl thead th{background:var(--cb);color:var(--c)}.tbl tbody th{font-weight:600}
.Q7{--c:#1f8a5b;--cb:#e3f5ec}.Q8{--c:#7c4dcf;--cb:#efe8fb}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.chips span{font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--mut)}
.tk{margin-top:12px;padding:10px 12px;background:var(--cb);border-radius:10px;font-size:.88rem}
.cap{font-size:.74rem;color:var(--mut)}
.solo{grid-template-columns:1fr}.solo .page{align-items:center;justify-content:center;text-align:center}
.big{font-size:2.6rem;line-height:1.1;font-weight:700;margin:8px 0}
.toc button{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;border-radius:10px;margin:5px 0;padding:11px 14px;font-size:.95rem}
.nav{max-width:1000px;width:100%;margin:0 auto;display:flex;align-items:center;gap:12px}
.mid{flex:1;text-align:center;font-size:.78rem;color:var(--mut)}
.prog{height:4px;background:#d9cdb6;border-radius:4px;margin-bottom:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ink);width:0;transition:width .3s}
@media(max-width:720px){.spread{grid-template-columns:1fr;grid-template-rows:auto auto;overflow:auto;align-content:start}.page{padding:18px;overflow:visible}.left,.right{box-shadow:none}.left{border-right:0;border-bottom:1px solid var(--line)}.qq{font-size:1.2rem}.big{font-size:2rem}.vo{display:none}.solo{align-content:center}}
.A{--c:#0f766e;--cb:#dff5f2}.dia svg{display:block;max-height:100%}.dia .kd,.dia .ks,.dia .ku,.dia .ka,.dia .kx,.dia .ko{stroke-width:1.5}.ku{fill:#e8f0ff;stroke:#2f6fed}.ks{fill:#f4f1ea;stroke:#8a8576}.ka{fill:#efe8fb;stroke:#7c4dcf}.kd{fill:#e3f5ec;stroke:#1f8a5b}.kx{fill:#fff0e6;stroke:#c2410c}.ko{fill:#fdecec;stroke:#b42318}.pr{stroke-dasharray:5 3}.n1{font:700 11px Helvetica,Arial,sans-serif;fill:#1d1d22}.n2{font:9.5px Helvetica,Arial,sans-serif;fill:#6b6b76}
.v1{font:700 .8rem Helvetica,Arial,sans-serif;vertical-align:middle;background:var(--ink);color:var(--paper);border-radius:999px;padding:3px 10px;margin-left:6px}
.solo .page{justify-content:safe center}.art{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:640px;margin:14px 0 10px}
.tile{background:linear-gradient(135deg,var(--a),var(--b));border-radius:16px;padding:8px 8px 6px;box-shadow:0 6px 14px rgba(70,50,15,.15);transition:transform .2s}.tile:hover{transform:translateY(-3px) rotate(-1deg)}.tile svg{width:100%;display:block}.tl{font:700 .68rem Helvetica,Arial,sans-serif;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25);margin-top:2px}
.disc{max-width:640px;font-size:.78rem;color:var(--mut);border:1px dashed var(--edge);border-radius:10px;padding:8px 12px;text-align:left;margin-bottom:10px}
.art *{transform-box:fill-box;transform-origin:center}.b rect{transform-origin:50% 100%;animation:bar 1.6s ease-in-out infinite}.pu{animation:pu 1.2s ease-in-out infinite}.flow{animation:fw 1.4s linear infinite}.bob{animation:bob 2s ease-in-out infinite}.dn{animation:dn 3s ease-in-out infinite}.fl{animation:fl 2.4s ease-in infinite}.sp{animation:sp 14s linear infinite}.dr{animation:dr 5s ease-in-out infinite}.wo{animation:wo 3s ease-in-out infinite}
@keyframes bar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}@keyframes pu{0%,100%{transform:scale(.6);opacity:.6}50%{transform:scale(1.2);opacity:1}}@keyframes fw{to{stroke-dashoffset:-26}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes dn{0%{stroke-dashoffset:120}60%,100%{stroke-dashoffset:35}}@keyframes fl{0%{transform:translateY(-4px);opacity:0}20%{opacity:1}100%{transform:translateY(28px);opacity:0}}@keyframes sp{to{transform:rotate(360deg)}}@keyframes dr{0%,100%{transform:translateX(-5px)}50%{transform:translateX(6px)}}@keyframes wo{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg) translateY(-2px)}}
@media(prefers-reduced-motion:reduce){.art *{animation:none!important}}@media(max-width:720px){.art{grid-template-columns:repeat(2,1fr)}}
.pl{margin:6px 0 4px}.plk{position:relative;display:inline-flex;align-items:center;gap:12px;padding:10px 16px 10px 12px;border-radius:999px;text-decoration:none;color:#fff;background:linear-gradient(120deg,#2f6fed,#7c4dcf 50%,#c2410c);background-size:200% 100%;box-shadow:0 8px 20px rgba(124,77,207,.35);overflow:hidden;transition:transform .2s,box-shadow .2s,background-position .6s;font-family:Helvetica,Arial,sans-serif;text-align:left}
.plk:hover{transform:translateY(-2px) scale(1.02);background-position:100% 0;box-shadow:0 12px 26px rgba(124,77,207,.45)}.plk:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shn 3.6s ease-in-out infinite}
.plg{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.22);font-size:1rem;animation:pu 2.4s ease-in-out infinite}.plt{display:flex;flex-direction:column;line-height:1.2}.plt small{font-size:.58rem;letter-spacing:.14em;opacity:.85}.plt b{font-size:.86rem}.pla{font-size:1.1rem;transition:transform .2s}.plk:hover .pla{transform:translate(3px,-3px)}
@keyframes shn{0%,55%{left:-60%}100%{left:130%}}@media(prefers-reduced-motion:reduce){.plk:after,.plg{animation:none}}

/* width + responsive */
body{height:100dvh;font-size:clamp(15px,.35vw + 13.5px,18px)}
.top,.nav,.book{max-width:min(1180px,100%)}

@media(min-width:721px) and (max-width:1000px){.page{padding:22px 24px}.qq{font-size:1.3rem}.big{font-size:2.2rem}}

background:radial-gradient(60% 50% at 20% 8%,rgba(47,111,237,.08),transparent 70%),radial-gradient(55% 45% at 92% 14%,rgba(124,77,207,.07),transparent 70%),radial-gradient(60% 50% at 80% 100%,rgba(194,65,12,.08),transparent 70%),repeating-linear-gradient(0deg,rgba(80,60,30,.028) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(80,60,30,.028) 0 1px,transparent 1px 3px),#fbf6ea}

<script>
var CH=[{"n": "1", "t": "Global Weather Intelligence Agent", "items": [{"l": "L7", "q": "Walk me through the Global Weather Intelligence Agent: what does it do and why did you build it?", "r": [["What it is", "A prototype of a weather forecasting AI agent that provides a weather forecast and travel advisory for a chosen time frame and city. The user picks a city, a horizon (hourly, 7-day or 16-day), a date and a temperature unit, and the app compiles those choices into one prompt for the agent."], ["Data sources", "Live forecasts from the Open-Meteo geocoding and forecast APIs, plus a ChromaDB vector store built from .txt files (travel advisories, flight rules, weather policies) in a ./knowledge_base folder."], ["Transparency", "A Harness Execution Trace column shows every tool call, its arguments and a truncated result next to the final answer, so each agent step can be inspected."], ["UX details", "City autocomplete (top 5 deduplicated suggestions, cached for an hour), a checkbox to include or skip the knowledge-base search, a prototype disclaimer and an architecture tab with a flowchart."], ["Why it matters", "A small, concrete demo of agent orchestration (tools, memory, fallbacks) rather than a plain chat wrapper."]], "sk": ["Product framing", "Agent orchestration", "RAG", "Transparency"], "tk": "Frames an agent as an inspectable system (tools, memory, trace) rather than a black-box chat, which is the trust problem buyers care about."}, {"l": "L8", "q": "How does the agent harness work, and how do you keep it reliable?", "r": [["Control loop", "A messages array holds the system prompt, user query and tool outputs. Each cycle calls the model with tool choice on auto; tool calls are executed, results appended as tool messages, and the loop ends when the model answers without tools or after 5 steps."], ["Tools", "get_weather (current, hourly, 1_week, 0_5_month; Celsius or Fahrenheit) and search_knowledge_base (top 3 chunks by vector similarity), registered with JSON-schema definitions and a name-to-function dispatch table."], ["Model fallback", "A helper tries the primary model and falls back to gpt-4o-mini on any error; the UI shows which model produced the answer."], ["RAG ingestion", "Persistent ChromaDB with the default embedding function. It scans .txt files, uses the file name as the ID and adds only documents not already stored, so ingestion is idempotent. Cached as a resource."], ["Output consistency", "The prompt always passes the temperature unit and requires Markdown tables and H3-only headers, so responses keep the same shape across runs."], ["Next steps", "The forecast calls have no explicit timeouts; I would add timeouts and retries, validate tool arguments against the schema, log traces and add evals for tool selection."]], "sk": ["Tool-calling loop", "Idempotent ingestion", "Fallback design", "Failure analysis"], "tk": "Treats an agent as a control loop with bounded steps, fallbacks and named gaps, not just an API wired together."}, {"l": "L8", "q": "How does the ReAct pattern work in the weather agent?", "sk": ["ReAct pattern", "Function calling", "Agent loop"], "r": [["The idea", "ReAct interleaves reasoning and acting. The model decides what to do, an action runs, the result comes back as an observation, and the model reasons again with that new evidence. It repeats until it can answer."], ["Mapping to the app", "Reason: the model reads the messages array and the tool schemas and picks a path. Act: it emits a tool call, either get_weather or search_knowledge_base (answering directly is possible but rare here). Observe: the app runs the function and appends the JSON result as a role: tool message. A dashed arrow in the diagram returns to the context step, and the loop repeats."], ["Typical run", "For 'Give me a 1-week weather forecast for Tokyo' with the knowledge base ticked: the first step calls get_weather with the city, horizon and unit; the next calls search_knowledge_base for advisories or flight rules; the last step answers with no tool call, in Markdown. The model can also request both tools in one step."], ["Implementation detail", "The app uses the model's native function calling, not the text 'Thought, Action, Observation' format from the original ReAct paper. Reasoning is therefore implicit: the trace shows actions (tool calls and arguments) and observations (truncated results), not a written chain of thought."], ["Why it helps", "Live data and retrieved documents enter the context as evidence, so answers are grounded. Actions can also depend on earlier observations, for example choosing which advisory to search for after seeing the forecast."], ["Limits", "Every cycle resends the full history, so tokens and latency grow; the 5-step cap bounds that and stops endless loops. A wrong first action can mislead later steps, which is why tool arguments need validation and the trace needs monitoring."]], "tk": "Maps reason, act and observe onto concrete parts of the app, and is precise that function calling makes the reasoning implicit."}, {"l": "Q7", "q": "Your weather agent goes from 100 to 100,000 users. What breaks first, and how do you scale it?", "sk": ["Bottleneck analysis", "Rate limits", "Caching"], "r": [["Context", "Each run is up to 5 model calls plus tool calls, and the full message history is resent every cycle, so input tokens grow with each step."], ["Limits", "Three ceilings: LLM requests and tokens per minute; the free weather API's fair-use terms (the free Open-Meteo tier is for non-commercial use, so check current terms); and a single-node ChromaDB directory."], ["Approach", "Cache weather by city, date and unit with a short TTL; queue and back off on 429s; move the vector store to a managed service; make the app stateless behind a load balancer."], ["Trade-off", "Caching adds staleness, so cap the TTL for hourly data. A queue adds latency under load, so show status and fall back to the smaller model."]], "tk": "Finds the real bottleneck (token growth in the loop plus shared rate limits) and orders fixes by cost and risk.", "tag": "Scaling & rate limits \u00b7 Intermediate"}, {"l": "Q7", "q": "How do you monitor tool usage and catch hallucinated answers from the agent in production?", "sk": ["Observability", "Hallucination detection", "Agent metrics"], "r": [["Context", "The execution trace already records each tool call, its arguments and a truncated result, so the raw material for monitoring exists. In production it has to be stored, searchable and tied to alerts."], ["Tool metrics", "Per tool: call count, success rate, latency, and the rate of invalid or unexpected arguments (wrong unit, unknown horizon, empty city). A spike in schema failures usually means a prompt or model change broke tool use."], ["Hallucination checks", "Extract the numbers in the final answer (temperatures, dates, probabilities) and compare them with the values in the get_weather payload; flag any figure with no source. For advisories, check that each cited rule appears in the retrieved chunks."], ["Loop health", "Track steps per request. If a noticeable share of requests hit the 5-step ceiling, the agent is looping or a tool is failing. Set the alert threshold from a baseline (for example 15%) rather than guessing. Also track the fallback-model rate and tokens per request."], ["Trade-off", "Number matching catches invented figures but not wrong reasoning. Sample traces for human review and feed the failures back into the offline eval set."]], "tk": "Turns an existing trace into production monitoring: tool metrics, grounding checks and loop alerts tied back to the eval set.", "tag": "Monitoring & grounding \u00b7 Intermediate"}, {"l": "Q8", "q": "Design the production version of this agent: reliability, evaluation, cost control and API limits.", "sk": ["Evals", "Reliability", "Cost control", "Security"], "r": [["Reliability", "Timeouts and retries with exponential backoff on every external call, schema validation of tool arguments, and a circuit breaker that routes to the fallback model after repeated failures."], ["Evaluation", "An offline set of city, date and unit prompts. Assert correct tool choice and arguments, no invented temperatures, and advisories cited when they exist. Track tool-selection accuracy and task completion rate."], ["Cost control", "A budget per request (max steps, max tokens), a daily spend cap per user, and tokens logged per step to catch runaway loops."], ["Failure modes", "Stale advisory documents, ambiguous city names, empty or truncated tool results, and prompt injection through knowledge-base text. Wrap retrieved chunks in explicit delimiters such as <context> tags and tell the model never to follow instructions inside them. The model still reads everything as one token sequence, so this lowers the risk rather than removing it."]], "tk": "Treats an agent as a system to measure and bound, with metrics, budgets and named failure modes.", "tag": "Evals, reliability & cost \u00b7 Advanced"}, {"l": "Q8", "q": "How do you defend the agent against prompt injection and malicious tool inputs?", "sk": ["Prompt injection", "Input validation", "Least privilege"], "r": [["Threat", "Two entry points: text (in the user message or a knowledge-base file) that tries to give the model new instructions, and model-generated tool arguments that are malformed or abusive. The knowledge base is a folder the owner controls today, so the risk is low, but it rises if users can upload documents or content is scraped."], ["Context isolation", "Wrap retrieved chunks in explicit delimiters such as <context> tags, and tell the model in the system prompt to treat that block as reference material and never follow instructions inside it. This helps, but the model reads one token sequence, so it cannot be the only defence."], ["Input validation", "Validate every tool call against a schema (Pydantic or JSON Schema in a Python app): allowed units and horizons, bounded date ranges, length limits on the city string. Reject or coerce before the function runs."], ["Least privilege", "Both tools are read-only (a forecast API and a vector search), so the worst case is a wrong answer, not data loss. Keep it that way: no write tools, no secrets in the prompt, strict HTTP timeouts and an allow-list of hosts the tools may call."], ["Testing", "Add adversarial cases to the eval set, such as an advisory file containing 'ignore previous instructions', and assert that the answer's behaviour does not change."]], "tk": "Treats injection as a layered problem: isolate context, validate inputs, limit privileges and test with adversarial documents.", "tag": "Security & prompt injection \u00b7 Advanced"}]}, {"n": "2", "t": "Song Reco Pilot", "items": [{"l": "L7", "q": "What is the Song Reco Pilot and what problem does it solve?", "r": [["What it does", "Helps people write better prompts for AI music generators. The user picks a genre fusion, mood, lyrics language, a focal character or creature, and a story concept."], ["Two actions", "Search Library Matches shows the 3 closest style anchors from a curated song library along with their working prompts. Get song prompt and lyrics generates a new production prompt."], ["Library", "Songs load from a Google Sheet, with a local CSV as fallback. Each row has song, genre, main creature, summary and prompt. A metrics bar shows the library size."], ["Tabs", "Studio Generator, Library Explorer, and an Architecture and Tech Stack page."], ["Output", "Title, genre and style, language, character, summary, and a production prompt covering structure, instruments, BPM, vocals and sample lyrics."]], "sk": ["Problem framing", "RAG", "Prompt engineering"], "tk": "Turns a vague creative need into a retrieval-plus-generation product with a fixed, checkable output format."}, {"l": "L8", "q": "Explain the retrieval-augmented pipeline behind the song prompts and how it degrades gracefully.", "r": [["Indexing", "Each library row becomes a passage (title, genre, creature, summary), embedded with BAAI/bge-small-en-v1.5, normalized and cached as a resource."], ["Retrieval", "The form inputs are joined into one query with the BGE retrieval instruction prefix and scored by cosine similarity; the top 3 are selected."], ["Generation", "The 3 retrieved prompts become few-shot style examples inside a structured prompt with a fixed output format, at temperature 0.7."], ["Model cascade", "Tries four Gemini models in order; on an API error it waits half a second and moves to the next. Worst-case latency is the sum of all attempts, which the next questions address."], ["Fallback", "If every model fails, the app shows the closest library match and its prompt, so the user always gets something usable."], ["Operations", "API key from environment or Streamlit secrets, service-account access to the sheet, and the data cached for 60 seconds."]], "sk": ["Embeddings", "Cosine retrieval", "Graceful degradation"], "tk": "Designs for failure: the user still gets a useful answer when every model call fails."}, {"l": "Q7", "q": "The library grows from hundreds to 100,000 songs and traffic rises 50x. How do you scale the studio?", "sk": ["Complexity analysis", "ANN search", "Quota management"], "r": [["Context", "Retrieval is a brute-force cosine search over every embedding in memory, plus one embedding call per query, then one or more Gemini calls."], ["Limits", "Memory and latency of exact search at 100,000 vectors, shared Gemini quotas and 429s, and the cost of regenerating embeddings."], ["Approach", "Use an approximate nearest-neighbour index or vector database; precompute embeddings offline and update incrementally; cache repeated specs; rate-limit per user and queue generation."], ["Trade-off", "Approximate search can miss the true best match. Measure recall against exact search on a sample and set a floor, for example 95%."]], "tk": "Reasons about complexity (linear search versus ANN) and the quality cost of approximation, with a measurable recall target.", "tag": "Scaling & vector search \u00b7 Intermediate"}, {"l": "Q7", "q": "How would you handle copyright and IP risk for AI-generated music prompts and lyrics?", "sk": ["IP risk", "Content filtering", "Product policy"], "r": [["Risk", "Two kinds: outputs that reproduce or closely paraphrase protected lyrics, and prompts that ask for a named artist's voice or a specific song. The app also retrieves from a library of existing songs, so those style anchors must not leak into the output."], ["Before generation", "Filter free-text inputs such as the story concept for artist names and song titles, and steer users to describe style (genre, tempo, instruments, mood) instead of naming people."], ["After generation", "Run an overlap check, for example n-gram or fuzzy matching, between the sample lyrics and a reference set of known lyrics, and regenerate or hide a result above a threshold. This needs a lawfully obtained reference set and only catches what is in it."], ["Policy", "State in the terms that outputs are suggestions the user must verify before commercial release, log what was generated, and offer a takedown route. The real policy needs legal advice; I would present the engineering controls, not a legal opinion."], ["Trade-off", "Stricter filters block legitimate prompts, such as an artist name used as a genre reference, and add latency. Tune with labelled examples and track the false-positive rate."]], "tk": "Pairs engineering controls (pre-filter, overlap check, logging) with a product policy, and is clear about what a filter cannot guarantee.", "tag": "IP risk & policy \u00b7 Intermediate"}, {"l": "Q8", "q": "How would you evaluate and harden the generation pipeline, including the model cascade and API limits?", "sk": ["Evaluation design", "Resilience", "IP risk"], "r": [["Evaluation", "Retrieval: hit rate of a relevant anchor in the top 3 on labelled queries. Generation: rubric scores for format compliance, language match and originality versus library prompts."], ["Cascade risks", "Sequential retries add latency. The worst case is the sum of every attempt plus the waits, so four 3-second timeouts is about 12 seconds. Set a hard total deadline across the whole cascade (for example 4 seconds; tune it from measured p95 latency), with per-call timeouts inside it, backoff on 429, and a circuit breaker that skips failing models for a cooldown. Hedged requests (starting the next model if the first is slow) cut tail latency but spend extra quota, so use them sparingly."], ["Limits", "Quotas may apply per model or per project, so confirm which. Cascading helps with model overload but not with a project-wide spend cap."], ["Safety and IP", "Prompts or lyrics that echo existing songs are a legal risk. Add a similarity check against known works and a content filter before display."]], "tk": "Plans for latency tails, quota behaviour and legal risk, not just the happy path.", "tag": "Evaluation & resilience \u00b7 Advanced"}]}, {"n": "3", "t": "Commodity Price & Forecast Dashboard", "items": [{"l": "L7", "q": "What does the Global Commodity Price and Forecast Dashboard show?", "r": [["Coverage", "Six commodities (WTI crude, wheat, corn, Arabica coffee, sugar #11 and gold) from 2010, using live Yahoo Finance futures data."], ["Currency view", "Prices can be shown in USD, EUR, GBP, JPY, INR or CAD using spot FX history."], ["Forecast controls", "A target year up to 2046 and a long-term inflation floor slider (1% to 5%, default 2.5%)."], ["KPIs", "2010 base price, latest price with percentage change, predicted price at the horizon, and forecast growth."], ["Tabs and UX", "Interactive Forecast, Data Pipeline and Valuation Engine, and ML Models and Specs; a light and dark theme toggle; a prominent not-financial-advice notice."]], "sk": ["Data product", "Time series", "Currency modelling"], "tk": "Packages a forecast as decision support with clear scope, KPIs and a disclaimer."}, {"l": "L8", "q": "How does the forecast engine work, and why add an inflation floor?", "r": [["Data pipeline", "History from 2010 via yfinance. Grain and softs quoted in US cents are divided by 100. The FX series is merged on nearest date, forward and back filled, then price is multiplied by the rate."], ["FX detail", "EURUSD and GBPUSD are quoted as USD per unit, so they are inverted to keep the conversion consistent."], ["Model", "Prophet with yearly seasonality only, linear growth and a low changepoint prior (0.01) to avoid chasing recent noise over a very long horizon."], ["Currency caveat", "Price is converted before the fit, so Prophet learns trend and seasonality on FX-adjusted prices, which mixes commodity behaviour with exchange-rate movement. A cleaner design forecasts the commodity in USD and applies a separate FX assumption (a forecast or a forward rate) afterwards, so the two uncertainties stay distinct."], ["Inflation floor", "Forecasts cannot fall below the latest price compounded at the chosen inflation rate. The lower band is floored at 95% of that, and the upper band at 115% of the forecast."], ["Caching", "Fetch and fit are cached for an hour per ticker, year, FX pair and inflation setting."], ["Caveat", "The floor is a judgment-based constraint, not a statistical one. It biases forecasts upward and the bands are heuristic multipliers, which is why the app carries a disclaimer."]], "sk": ["Prophet", "Data engineering", "Constraint design", "Caching"], "tk": "Knows the model's limits: the inflation floor is a stated assumption, flagged as judgment rather than statistics."}, {"l": "Q7", "q": "Traffic grows 100x and users want every commodity and currency. How do you scale the forecast engine?", "sk": ["Caching analysis", "Data engineering", "Data licensing"], "r": [["Context", "The cache key includes target year, FX pair and inflation, but the Prophet fit depends only on ticker and FX pair."], ["Insight", "That is 6 commodities x 6 currencies = 36 distinct fits. The current cache can create thousands of near-duplicate fits as users move the year or the slider."], ["Approach", "Fit once per ticker and FX pair, store the forecast to 2046, and apply the inflation floor and horizon at read time. Refresh on a schedule, not on demand. If you also forecast in USD and convert afterwards (see the currency caveat), the 36 fits drop to 6 commodity fits plus a small FX layer."], ["Limits", "yfinance is an unofficial wrapper around Yahoo Finance, so heavy traffic risks throttling and there is no SLA. For production, use a licensed market data feed and store history in your own database."]], "tk": "Spots a caching inefficiency by asking which inputs actually change the model, cutting work to 36 fits.", "tag": "Caching & data licensing \u00b7 Intermediate"}, {"l": "Q8", "q": "How would you improve forecast accuracy and make the uncertainty honest?", "sk": ["Backtesting", "Calibration", "Baselines"], "r": [["Problem", "One yearly-seasonality Prophet model with a heuristic inflation floor and fixed band multipliers (95% and 115%) cannot express real forecast uncertainty."], ["Approach", "Rolling-origin backtests; report MAPE and interval coverage by horizon; compare with naive and ARIMA baselines; model returns in log space."], ["Assumptions to test", "Commodities are mean-reverting and shaped by supply shocks, so a linear trend plus floor may overstate long-run growth. Test regime changes and add drivers such as FX, rates and inventories."], ["Presentation", "Show bands calibrated by backtest, label values beyond about 5 years as scenarios, and keep the disclaimer."]], "tk": "Moves from a forecast to a validated forecast: baselines, backtests, calibration and honest labelling.", "tag": "Forecast validation \u00b7 Advanced"}, {"l": "Q8", "q": "How would you turn this into a real-time streaming market dashboard?", "sk": ["Streaming architecture", "Event pipelines", "Data licensing"], "r": [["Context", "Today the app pulls end-of-day history from yfinance on demand and fits Prophet on it. A live dashboard adds a second, separate path for ticks. The forecast should stay a scheduled batch job, not rerun on every price update."], ["Ingestion", "Take a licensed real-time feed over WebSocket (futures data needs an exchange-licensed vendor, so check coverage and redistribution terms) and publish ticks to a log such as Kafka or Kinesis. At small scale a managed queue is enough; the log earns its cost when you need replay and several consumers."], ["Aggregation", "Build minute and hourly OHLC candles with a stream processor such as Flink, and keep recent candles in a time-series store such as Redis TimeSeries or TimescaleDB. Persist history to your own database."], ["Delivery", "Push updates to browsers over WebSockets or Server-Sent Events, throttled (for example at most 2 renders per second) so a fast market cannot overload the UI. Send a snapshot on connect, then deltas."], ["Failure modes", "Late or out-of-order ticks, feed disconnects (reconnect with backoff and mark data stale), market-closed periods, and unit differences such as US cents. Show a last-updated time and a stale-data banner."]], "tk": "Separates the live tick path from the batch forecast path and names the licensing, ordering and staleness problems.", "tag": "Streaming architecture \u00b7 Advanced"}]}, {"n": "4", "t": "Board Game Analytics Dashboard", "items": [{"l": "L7", "q": "What can a user learn from the board game analytics dashboard?", "r": [["Dataset", "680 games from BoardGameGeek's Top 2000 list (2015 snapshot), with weight (complexity), rating, year, player counts, playtime, mechanics and categories."], ["Seven tabs", "Clusters, What Predicts Rating, Weight Over Time, Find Games Like Yours, Over/Underrated, Recent Games (2016 to 2024), and How This Works."], ["Clusters", "Six named groups, such as Abstract and Grid, Drafting and Engine Building, Economic Strategy, and Wargames and Campaigns, plotted on a PCA scatter."], ["Over and underrated", "Ranks games by residual (actual minus predicted rating). Twilight Struggle is the most underrated at +1.17."], ["Extras", "CSV download, a shuffle for random picks, and a recent-games panel kept separate from the model."]], "sk": ["Exploratory analysis", "Clustering", "Data storytelling"], "tk": "Converts a 680-row dataset into seven views a non-technical reader can use."}, {"l": "L8", "q": "Walk me through the modelling choices and their limits.", "r": [["Features", "Standardized numeric features plus one-hot dummies for category and mechanic."], ["Why ridge", "Plain regression had a negative cross-validated R\u00b2 on 680 rows with sparse dummies. The L2 penalty stabilized 5-fold CV R\u00b2 at 0.161. Boosted trees gave no real gain and were harder to explain. Weight is the top predictor (importance 0.24)."], ["Clustering and PCA", "K-means with k=6, chosen from inertia and cluster interpretability. The two PCA axes explain about 8% and 6% of variance, so the map is indicative."], ["Recommender", "Cosine similarity on the same standardized features, so similar means the same thing as in the clusters and regression."], ["Data integrity", "The 2016 to 2024 games are hand-compiled with approximate ratings and deliberately kept out of the model, to avoid mixing exact and approximate data and survivorship bias."], ["Limits", "R\u00b2 of 0.16 means results are directional only. The data is a 2015 snapshot with coarse category and mechanic tags, and model outputs ship as precomputed JSON."]], "sk": ["Ridge regression", "Cross-validation", "Model selection", "Bias awareness"], "tk": "Picks the simpler model on evidence (CV R\u00b2 from negative to 0.161) and states what the number does not support."}, {"l": "Q7", "q": "Scale the analytics to the full BoardGameGeek catalogue and keep it fresh. How?", "sk": ["Architecture trade-offs", "Pipelines", "Similarity search"], "r": [["Context", "Today: 680 games, results precomputed into static JSON, everything rendered in the browser."], ["Limits", "At 100,000+ games the payload and scatter plot become too heavy, and BGG's data access has rate limits and terms of use (check the current rules)."], ["Approach", "Run an offline pipeline (ingest, features, fit, cluster) on a schedule; store results in a database; serve paginated or aggregated API responses; use an ANN index for similar games; bin or downsample the scatter."], ["Trade-off", "Static JSON is cheap and fast but stale. A server adds cost and operations but allows freshness and personalization."]], "tk": "Chooses architecture from data size and freshness needs, and states the trade-off.", "tag": "Pipelines & freshness \u00b7 Intermediate"}, {"l": "Q8", "q": "R\u00b2 is only 0.161. How do you defend the underrated ranking, and how would you improve the model?", "sk": ["Statistical rigour", "Feature design", "Selection bias"], "r": [["Reading the metric", "An R\u00b2 of 0.16 leaves most rating variance unexplained, so residuals are partly noise. Use the ranking as a prompt for exploration, not a verdict."], ["Checks", "Bootstrap residuals to see which games stay in the top group, report MAE, and inspect residuals by cluster for systematic bias."], ["Improvements", "Add designer, publisher, theme, description-text embeddings, number of voters and recency. Try other models only if cross-validation improves."], ["Bias", "A Top 2000 list truncates the low end of ratings through selection, which shrinks apparent effects."]], "tk": "Shows statistical humility: quantify what the model cannot explain and design checks before claiming insight.", "tag": "Statistical rigour \u00b7 Advanced"}]}, {"n": "5", "t": "Ideas Bucket", "items": [{"l": "L7", "q": "What is the Ideas Bucket and how does it help someone act on their ideas?", "r": [["Concept", "A workspace for capturing ideas (tossing them in the bucket) and moving them from spark to realized."], ["Idea model", "Title, description, category (tech, design, business, creative, lifestyle, science, random), impact 1 to 5, complexity low, medium or high, status, tasks and an activity log."], ["Views", "A grid of idea cards with search and category filters, a bucket visualizer, and a stats dashboard."], ["Stir the Bucket", "Randomly spotlights one pending idea to break analysis paralysis."], ["Delight", "Sound effects with a mute toggle, animations, a quick-complete button, a details modal and a reset to seed ideas."]], "sk": ["Product design", "Data model", "Behavioural nudge"], "tk": "Uses a simple mechanic (Stir the Bucket) to attack a real behaviour problem: analysis paralysis."}, {"l": "L8", "q": "How is state managed, and what would you change to take it to production?", "r": [["State", "React state initialized lazily from localStorage with a safe JSON parse fallback to seed data; an effect writes back after every change."], ["Derived data", "useMemo for the selected idea and the filtered list (text search over title and description, plus category)."], ["Updates", "Create, toggle status, edit and delete all use immutable array updates. Each status change adds a log entry, giving every idea an audit trail."], ["Stir logic", "Filters out realized ideas, runs a short timed animation, then picks one at random, with a guard for the empty case."], ["Structure", "Separate components for the visualizer, stats, idea card, details modal and sound effects."], ["Production gaps", "localStorage is single-device with no sync, and IDs come from a timestamp plus a random string. I would add backend persistence, auth, undo, tests and an accessibility review of sound and motion."]], "sk": ["State management", "Immutability", "Audit trail", "Production gaps"], "tk": "Separates what works in a prototype from what breaks at scale, and names the gaps."}, {"l": "Q7", "q": "The Ideas Bucket needs accounts, sync across devices and team workspaces. How do you scale it?", "sk": ["Data modelling", "Sync design", "Storage limits"], "r": [["Context", "State lives in the browser's localStorage and the whole array is rewritten on every change."], ["Limits", "localStorage is capped at a few megabytes per origin, is synchronous, and is single-device with no conflict handling. Unbounded activity logs make the payload grow."], ["Approach", "Backend tables for ideas, tasks and logs; optimistic updates with a version or timestamp per record; paginated logs; auth and per-team workspaces."], ["Trade-off", "Last-write-wins is simple but can drop edits. Field-level merges or CRDTs fix that at higher complexity."]], "tk": "Turns a prototype's storage limits into a concrete data model and a conflict strategy.", "tag": "Sync & data modelling \u00b7 Intermediate"}, {"l": "Q8", "q": "How would you test whether the app changes behaviour, and what telemetry and privacy limits apply?", "sk": ["Experiment design", "Metrics", "Privacy"], "r": [["Hypothesis", "Stir the Bucket shortens the time from idea capture to first action."], ["Metrics", "Activation (ideas created on day 1), stir-to-start rate, time from spark to first task, ideas realized per week, and 4-week retention."], ["Method", "A/B test with and without Stir; watch for novelty effects; segment by bucket size."], ["Constraints", "Keep telemetry minimal and opt-in, and keep ideas private. Moving off local-only storage creates privacy obligations."]], "tk": "Frames a feature as a testable hypothesis with a primary metric, guardrails and privacy limits.", "tag": "Experiments & privacy \u00b7 Advanced"}, {"l": "Q8", "q": "Design an offline-first sync architecture so the Ideas Bucket works across devices.", "sk": ["Offline-first", "Conflict resolution", "Sync design"], "r": [["Local store", "Replace localStorage with IndexedDB (for example through Dexie): asynchronous, structured, indexed and far larger. Migrate existing data once on first load and request persistent storage so the browser does not evict it."], ["Identity", "Generate IDs on the client with UUIDv7 or ULID so ideas created offline never collide, replacing the timestamp-plus-random IDs."], ["Sync queue", "Record each change as a mutation (create idea, toggle status, edit field, add task) in a local outbox. On reconnect, send them in order with an idempotency key so retries do not duplicate, and back off exponentially on server errors."], ["Conflict resolution", "Use last-write-wins per field with a hybrid logical clock, because phone clocks drift. Activity logs are append-only, so they merge as a union. Vector clocks detect concurrent edits but do not resolve them; CRDTs are for cases like concurrent text editing."], ["Trade-off", "Last-write-wins is simple but silently drops one of two concurrent edits to the same field. CRDTs keep both at the cost of metadata and complexity. Per-field LWW is enough for one person's ideas; revisit it for team workspaces."]], "tk": "Chooses a conflict strategy for the data actually stored (fields and append-only logs) instead of reaching for CRDTs by default.", "tag": "Offline-first sync \u00b7 Advanced"}]}, {"n": "6", "t": "Transit Router (Wayfarer)", "items": [{"l": "L7", "q": "What is the transit router (Wayfarer) and what decision does it help a traveller make?", "r": [["What it is", "A route comparison tool that lays out transit, walking and ride-share options for the same trip side by side, covering time, distance, cost and carbon (the footer cites EPA averages for carbon indexes)."], ["Inputs", "Start and destination via place search with a swap button, a picker for 10 countries (US, UK, India, Germany, Italy, France, Japan, Canada, Australia, Spain), and one-tap demo presets such as Times Square to Central Park."], ["What-if controls", "An editable base transit fare (defaulting per country and currency), a ride-share surge multiplier slider, and weather (clear, rain, heavy snow) that changes travel times."], ["Map and steps", "The map draws the selected mode: green dashed for walking, indigo for transit, amber for driving, with start and end pins and step-by-step directions."], ["Two modes", "Live Google Maps when an API key is configured; otherwise an interactive sandbox canvas, so the app works with no setup. Scaffolded in Google AI Studio."]], "sk": ["Comparison UX", "Scenario inputs", "Progressive setup"], "tk": "Frames travel choice as a trade-off between time, cost and carbon under changing conditions."}, {"l": "L8", "q": "How are the routes, times and costs computed, and what is real versus simulated?", "r": [["Stack", "React and TypeScript, @vis.gl/react-google-maps (map, advanced markers, pins), a custom polyline component and lucide icons."], ["Distance", "Haversine great-circle distance between the two points, using an Earth radius of 6,371 km."], ["Time model", "Duration is distance divided by a mode speed (walking 1.3 m/s, transit 7.8 m/s including stops, driving 11.5 m/s), multiplied by a weather factor. Rain: 1.35 walking, 1.15 driving, 1.05 transit. Snow: 1.85, 1.5 and 1.25."], ["Reactivity", "An effect recomputes all three routes whenever the start, end, weather, fare or surge changes. An 850 ms timeout mimics API latency and drives the loading state."], ["Paths and steps", "Paths are 10-point interpolations with a sine-curve offset, and steps are templated. A transit trip is a short walk, a ride covering about 84% of the distance with a stop count of roughly distance over 1.4 km, then a final walk."], ["Real vs simulated", "Routing is simulated: even in live-map mode the Google map only displays the generated paths. This is a prototype of the comparison experience, not a trip planner."], ["Configuration", "The API key is read from the environment and validated (non-empty, not a placeholder, longer than 10 characters). If it fails, a setup screen offers sandbox mode, and users can switch between live and sandbox."], ["Next steps", "Replace the simulator with a real routing API for transit schedules, walking and driving; use agency fare data and live weather; compute emissions from actual distance by mode; add tests for the time model."]], "sk": ["Geospatial maths", "Simulation", "Reactive recompute", "Honest scoping"], "tk": "States what is simulated versus real, which is the credibility test for any prototype."}, {"l": "Q7", "q": "Replace the simulator with real routing. What happens to cost and API limits, and how do you scale?", "sk": ["Cost analysis", "API design", "Debouncing"], "r": [["Context", "The effect that computes routes depends on start, end, weather, fare and surge, but only start and end change the route; the rest change time or cost."], ["Insight", "With a paid routing API, every slider drag would trigger a billed request. Fetch routes when start or end change, and apply cost, surge and weather locally to the cached result."], ["Approach", "Debounce inputs, cache routes by origin-destination pair, request only the fields the UI uses, use session tokens for place autocomplete, and set key restrictions and quotas."], ["Limits", "Routing and Places are billed per request with per-minute quotas, and transit is typically priced above walking or driving, so budget alerts matter."]], "tk": "Finds a cost bug before it ships by separating routing inputs from pricing inputs.", "tag": "API cost & debouncing \u00b7 Intermediate"}, {"l": "Q8", "q": "Design the production routing, fare and carbon model, and say how you would validate it.", "sk": ["Modelling", "Validation", "Regional limits"], "r": [["Data", "Real transit schedules and disruptions from the routing API, agency fare tables, live weather, and emissions factors per mode and distance."], ["Model", "A door-to-door time distribution (walk, wait, ride, transfer) rather than a point estimate; expected cost under surge; carbon as distance times a mode factor."], ["Validation", "Compare predicted and actual trip times on sampled trips; track error by city and time of day; alert above a threshold."], ["Risks", "Fare rules vary by agency, ride-share surge is not public, and EPA averages reflect US conditions, so label estimates by region and show confidence."]], "tk": "Specifies data sources, an error metric and regional limits for what is today a prototype.", "tag": "Modelling & validation \u00b7 Advanced"}]}, {"n": "7", "t": "DIY Project Helper Chatbot", "items": [{"l": "L7", "q": "What is the DIY Project Helper chatbot and how did you build it?", "r": [["What it is", "A chatbot where users describe a project they want to tackle and get step-by-step instructions, a list of tools and materials, and troubleshooting tips for common problems."], ["How it started", "Built in Replit from a single natural-language prompt that asked for a fully interactive app trained on different project types, with pottery, glass painting, vegan fur toy making and carpentry as examples."], ["Craft coverage", "Eight categories: pottery and ceramics, glass painting, carpentry, textiles, toy making, home improvement, electronics and tech, and gardening."], ["Answer quality", "Detailed numbered steps, material lists with specific quantities and vegan or eco-friendly alternatives, essential and optional tools, and content adapted to beginner, intermediate or advanced skill levels."], ["Convenience", "Instructions can be downloaded as clean text files for offline use, and chat history is saved so users can return to a project."]], "sk": ["Prompt-to-product", "Domain coverage", "User needs"], "tk": "Shows speed from idea to working product (one prompt, 8 domains) while specifying the outputs users need."}, {"l": "L8", "q": "Walk me through the data flow architecture and the engineering choices behind the chatbot.", "r": [["Request path", "Six stages: the React interface captures the project question; an HTTP POST goes to Express.js routing on port 5000; GPT-4o generates the answer; the exchange is saved to PostgreSQL; the response is formatted for display and download; React Query refreshes its cache and syncs the UI."], ["AI layer", "OpenAI GPT-4o with custom DIY system prompts across the 8 specialized craft categories, so guidance is shaped to the type of project."], ["Frontend", "React 18, TypeScript and Vite, with shadcn/ui and Tailwind CSS. React Query handles server state, so the interface updates after each response."], ["Backend and data", "Express.js with TypeScript and RESTful endpoints on one unified server. PostgreSQL on Neon serverless via Drizzle ORM and migrations stores sessions and messages."], ["Safety and config", "Secrets in environment variables, Zod validation on inputs, and error handling with fallbacks."], ["Performance", "TypeScript end to end, hot reload in development and optimized caching. Typical response times per the design: simple questions 3 to 8 seconds, complex projects 8 to 15 seconds, multi-step guides 10 to 20 seconds."], ["Next steps", "Stream responses to cut the perceived wait on long guides; add safety warnings for power-tool and electronics projects; add rate limiting; build a small test set to check instruction quality across categories."]], "sk": ["Full-stack architecture", "Persistence", "Validation", "Latency analysis"], "tk": "Maps a six-stage pipeline end to end and ties each stage to a latency, safety or persistence concern."}, {"l": "Q7", "q": "The chatbot takes off: 10x traffic, with answers taking 10 to 20 seconds. How do you scale and cut cost?", "sk": ["Latency engineering", "Unit economics", "Rate limits"], "r": [["Context", "Each answer is one large language model call saved to PostgreSQL, and long multi-step guides take up to 20 seconds."], ["Limits", "OpenAI requests and tokens per minute by usage tier, serverless database connection limits and cold starts, and a single Express server."], ["Approach", "Stream tokens so first words appear quickly; run stateless Express instances behind a load balancer; pool database connections; cache popular project guides with a semantic cache; cap or summarize history."], ["Metrics", "p50 and p95 latency, time to first token, cost per answer (input tokens x price + output tokens x price), cache hit rate and 429 rate."]], "tk": "Ties each scaling decision to a metric: latency, cost per answer and rate-limit headroom.", "tag": "Latency & unit economics \u00b7 Intermediate"}, {"l": "Q8", "q": "How do you make the advice safe and reliable for risky projects such as power tools and electronics?", "sk": ["Risk management", "Evaluation", "Grounding"], "r": [["Risk", "A confident but wrong instruction (kiln temperatures, mains wiring, tool use) can cause injury, so errors cost more here than in most chatbots."], ["Approach", "Classify requests by risk; require safety checklists for high-risk categories; ground answers in vetted sources through retrieval; defer to a professional for hazardous steps."], ["Evaluation", "A labelled set of risky prompts per category. Measure safety-warning presence, expert-reviewed factual accuracy and refusal precision, and rerun on every prompt or model change."], ["Operations", "Log prompts and outputs with consent, collect feedback on bad answers, and keep a rollback path for prompt versions."]], "tk": "Matches the level of safeguards and evaluation to the consequence of a wrong answer.", "tag": "Safety & evaluation \u00b7 Advanced"}, {"l": "Q8", "q": "How do you stream answers to the user while keeping safety checks and an audit log?", "sk": ["Streaming", "Moderation", "Audit logging"], "r": [["Transport", "Call the model with streaming on and relay tokens from Express to the React client over Server-Sent Events. This cuts time to first token on 10 to 20 second guides."], ["Before streaming", "Classify the request's risk (power tools, mains electricity, kilns and heat, chemicals). For high-risk categories add a mandatory safety checklist to the system prompt, so safety is in the answer from the first token."], ["During streaming", "Generic moderation endpoints target harmful content, not a wrong kiln temperature or unsafe wiring advice, so add domain rules such as required warnings and banned steps. Buffer by sentence or step and check each unit; on a failure stop the stream and show a safe replacement. The cost is a small delay to first token for high-risk answers; low-risk ones stream directly."], ["Persistence", "Accumulate the full completion on the server in the request handler and write it to PostgreSQL when the stream ends. If the client disconnects, save the partial answer with a flag. At this scale no separate background worker is needed."], ["Audit log", "Record the user message, final text, risk class, which checks fired, model and prompt version, and timestamps. Keep it with user consent and a retention limit."]], "tk": "Keeps the speed benefit of streaming while placing safety checks before and during the stream, with a complete audit record.", "tag": "Streaming & audit logging \u00b7 Advanced"}]}];
CH.push({"n": "8", "t": "Creator Dashboard", "items": [{"l": "L7", "q": "What is the Creator Dashboard, and who is it for?", "r": [["What it is", "A prototype dashboard that turns a creator's own catalog into one overview. It is built from 103 songs published on the creator's Flow Music profile (flowmusic.app/energized_by_riffs)."], ["Source data", "One spreadsheet with a row per song. The dashboard works on the creator's real catalog, not sample data."], ["How it was built", "Generated using VibeFactory, starting from the spreadsheet and a plain-language description of the goal."], ["Who it is for", "The creator first, for a quick read of what the catalog contains and where it leans. Listeners and collaborators can also use it to get a fast sense of the style."], ["Why it matters", "It shows ownership from start to finish: real personal data, an AI-assisted build and a clear way to read a creative catalog."]], "sk": ["Data storytelling", "AI-assisted build", "Product framing"], "tk": "Shows how a personal catalog becomes a product: real data, a clear audience and an AI-assisted build."}, {"l": "L8", "q": "How was the dashboard generated, and how do you make sure the numbers can be trusted?", "r": [["Build approach", "VibeFactory generated the app from the spreadsheet and a brief. The output is treated as a draft that needs checking, not as finished work."], ["Trust checks", "Totals are compared with the spreadsheet (103 rows). Counts per category must add up to the total. Blank or duplicate titles are listed instead of silently dropped."], ["Single source of truth", "The spreadsheet is the only input, so every chart can be traced to rows a person can open and read."], ["Known limits", "The dashboard reflects the spreadsheet, not live Flow Music activity such as plays or likes, unless that data is added to the sheet. Categories depend on how each song was labeled."]], "sk": ["AI-assisted build", "Data quality", "Reconciliation"], "tk": "Treats generated code as a draft and proves the numbers by reconciling them to the source rows."}, {"l": "Q7", "q": "Why use pie charts for a music catalog, and what are their limits?", "r": [["Good for", "Showing the share of the catalog by a few categories, such as genre, language or main character. Shares are what a pie shows best."], ["Limits", "Past about six slices a pie becomes hard to read, and small differences between slices are hard to compare."], ["Remedies", "Group small categories into Other, sort slices by size, label each with its count and percentage, and use a bar chart when the goal is comparison."]], "sk": ["Data visualization", "Chart choice", "Communication"], "tk": "Chooses a chart for the question it answers and says where it fails."}, {"l": "Q8", "q": "How would you take this from a one-off spreadsheet to a production dashboard?", "r": [["Refresh", "A scheduled job copies the sheet into a typed catalog table, so updates do not depend on someone editing the dashboard code."], ["Validation", "Checks for duplicate titles, blank fields and unexpected categories run before the data goes live, and failures keep the last good version."], ["Serving", "A small metrics API returns aggregated counts that are cached, so the browser never downloads the full catalog."], ["Source", "Check what Flow Music offers for exporting catalog data. Until then the spreadsheet stays the source of truth."]], "sk": ["Data pipelines", "Validation", "Scaling"], "tk": "Names the smallest production steps that remove manual work without over-building."}]});
